[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the RSI driver is `crates/ohrsi`, the same as any other member.
members = ["crates/*"]
# `vendor/` holds the pinned OpenHuman and tinyrsi submodules and `benchmarks/`
# the pinned openhuman-benchmarks submodule; each is its own workspace with its
# own lockfile. `worktrees/` holds `git worktree` checkouts of this same
# repository; each contains a full copy of this manifest and every crate under
# it, so without this entry cargo walks into them and reports duplicate
# packages.
exclude = ["vendor", "benchmarks", "worktrees", "runs"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.1"
edition = "2024"
# tinyrsi and its pinned hive libraries require 1.96; matching it now means
# linking tinyrsi later does not move the floor.
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/oh-bench-rsi"

[workspace.dependencies]
# Derive macros for the crate-wide error type in `crates/ohrsi/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# Campaign manifests are deserialized into typed structs.
serde = { version = "1", features = ["derive"] }
# Campaign manifests are TOML files under `campaigns/`. Only parsing is needed.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
