name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Loop scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The unit tests cover only the pure parts of the scorer and gates.
          submodules: false

      - name: Unit tests
        run: python3 -m unittest discover -s loops/lme2-recall/tests -v

  loop:
    name: Loop folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job builds and runs submodule code; don't persist the token.
          persist-credentials: false
          submodules: false

      # tinyrsi (for the binary) and OpenHuman (for TinyMemory, which the
      # memd adapter builds against), each with its own nested submodules.
      # `benchmarks/` is not needed: nothing here runs the evaluation.
      - name: Check out submodules
        run: |
          set -euo pipefail
          git submodule update --init vendor/tinyrsi vendor/openhuman
          git -C vendor/tinyrsi submodule update --init --recursive --depth 1
          git -C vendor/openhuman submodule update --init --recursive --depth 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/tinyrsi -> target
            adapters/lme2-memd -> ../../target/memd

      # `check` resolves the OpenRouter key's name but never uses its value.
      - name: Validate the loop folder
        env:
          OPENROUTER_API_KEY: ci-placeholder
        run: cargo run --locked --manifest-path vendor/tinyrsi/Cargo.toml -p tinyrsi-cli -- check loops/lme2-recall

      - name: Build the memd adapter against the vendored TinyMemory
        run: cargo build --locked --manifest-path adapters/lme2-memd/Cargo.toml --target-dir target/memd
