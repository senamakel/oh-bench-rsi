version: 2
updates:
  # The memd adapter is the only Rust package this repository owns; the
  # vendored submodules are bumped by hand (AGENTS.md, Vendored dependencies).
  - package-ecosystem: cargo
    directory: /adapters/lme2-memd
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One pull request per week for routine compatible updates; anything
      # breaking still arrives as its own reviewable PR.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
