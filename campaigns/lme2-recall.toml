# Improve OpenHuman's recall over long agent working histories.
#
# Measured on the frozen LongMemEval-V2 web subset (campaigns/lme2/subset.json):
# 100 browsing trajectories ingested through OpenHuman's TinyMemory lifecycle
# into a local CortexDB, then 225 text-only questions answered from the recall
# pack OpenHuman injects before a turn. GLM 5.3 Flash is reader and judge.
name = "lme2-recall"
brief = """
Raise OpenHuman's held-out accuracy on LongMemEval-V2 (web, small tier) by
improving how TinyMemory gathers, ranks, excerpts and renders recalled
evidence into the pack. Changes must help any OpenHuman user with long agent
histories, ship with unit tests, and keep TinyMemory's suite green. Never
special-case benchmark content, and never change the benchmark or its judge.
"""

[benchmark]
workdir = "."
# One paired evaluation of a candidate checkout; prints
# `METRIC lme2_dev_accuracy=…` and `METRIC lme2_test_accuracy=…`.
command = ["python3", "-I", "scripts/bench/lme2_eval.py", "--engine", "cortex"]
env = []
timeout_secs = 14400

[metric]
name = "lme2_test_accuracy"
direction = "maximize"

[surface]
editable = [
    "vendor/openhuman/vendor/tinymemory/crates/tinymemory-tools",
    "vendor/openhuman/vendor/tinymemory/crates/tinymemory-integrations",
]
# The engine contract is shared with every OpenHuman engine.
frozen = ["vendor/openhuman/vendor/tinymemory/crates/tinymemory-api"]

[evaluation]
# Task selection is pinned by the subset's own seed (27); these two seeds
# name the dev and test splits for the paired decision.
seeds = [27, 28]

[budget]
usd_cap = 5.0
max_epochs = 2
proposals_per_epoch = 1
