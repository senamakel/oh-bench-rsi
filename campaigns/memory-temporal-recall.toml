# Answer "which came first" questions from ordered evidence.
#
# FINDINGS.md #4 in benchmarks/memory: on LongMemEval gpt4_fe651585 recall
# surfaced a recent and an older event out of order and the answer flipped.
# The levers are OpenHuman's date-hint inference and TinyMemory's time-aware
# ranking and within-session ordering.
name = "memory-temporal-recall"
brief = """
Raise OpenHuman's accuracy on temporal-reasoning questions in the pinned memory
audit by improving date-hint inference in OpenHuman core and time-aware ranking
and ordering in TinyMemory recall. Rendered evidence must preserve the order in
which events happened. Do not infer that a fact was never recorded from its
absence in a small recalled pack. Do not change the benchmark, the questions or
the judge. Keep OpenHuman core's and TinyMemory's tests green.
"""

[benchmark]
workdir = "."
command = ["scripts/bench/memory-metric.sh", "--arm", "oh-tinymemory-cortex-direct", "--category", "temporal-reasoning"]
env = ["OPENROUTER_API_KEY"]
timeout_secs = 7200

[metric]
name = "memory_accuracy"
direction = "maximize"

[surface]
editable = [
    "vendor/openhuman/crates/openhuman-core/src/memory/lifecycle/date_hint.rs",
    "vendor/openhuman/vendor/tinymemory/crates/tinymemory-tools/src/recall/gather.rs",
    "vendor/openhuman/vendor/tinymemory/crates/tinymemory-tools/src/recall/render.rs",
]
frozen = ["vendor/openhuman/vendor/tinymemory/crates/tinymemory-api"]

[evaluation]
seeds = [27, 28, 29]

[budget]
usd_cap = 10.0
max_epochs = 4
proposals_per_epoch = 2
